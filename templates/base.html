<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {# Title first #}
    <title>Lucas Rollin Ferreira{% if page.title %} · {{ page.title }}{% endif %}</title>
    {# SEO basics #}
    <meta name="description"
          content="Portfolio of Lucas Rollin Ferreira featuring full-stack web development, data analytics, engineering projects, certifications, and technical skills.">
    <meta name="author" content="Lucas Rollin Ferreira">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ current_url }}">
    {# Language alternates #}
    <link rel="alternate" hreflang="en" href="{{ config.base_url }}">
    <link rel="alternate" hreflang="pt" href="{{ config.base_url }}pt/">
    <link rel="alternate" hreflang="x-default" href="{{ config.base_url }}">
    {# Favicon #}
    <link rel="icon"
          type="image/png"
          href="{{ get_url(path='/img/favicon.png') }}">
    {# Open Graph ##}
    <meta property="og:title" content="Lucas Rollin Ferreira · Portfolio">
    <meta property="og:description"
          content="Civil engineer, full-stack developer and data analyst portfolio.">
    <meta property="og:image" content="{{ get_url(path='/img/headshot.png') }}">
    <meta property="og:url" content="{{ current_url }}">
    <meta property="og:type" content="website">
    <meta property="og:locale"
          content="{% if lang == 'pt' %}pt_BR{% else %}en_US{% endif %}">
    <meta property="og:locale:alternate"
          content="{% if lang == 'pt' %}en_US{% else %}pt_BR{% endif %}">
    {# Theme #}
    <meta name="theme-color"
          content="#ffffff"
          media="(prefers-color-scheme: light)">
    <meta name="theme-color"
          content="#0a0a0a"
          media="(prefers-color-scheme: dark)">
    <meta name="google-site-verification"
          content="U7JcR670Wn3vk7EBsQRQr-FDrpR7MiXjRz8EL-f-yjg" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Lucas Rollin Ferreira",
      "jobTitle": "Civil Engineer, Full-Stack Developer and Data Analyst",
      "address": { "@type": "PostalAddress", "addressLocality": "Florianópolis", "addressCountry": "BR" },
      "url": "{{ config.base_url }}",
      "sameAs": [
        "https://www.linkedin.com/in/lucas-rollin-ferreira",
        "https://github.com/lucas-rollin"
      ],
      "image": "{{ get_url(path='/img/headshot.png') }}",
      "email": "mailto:lucasrollinferreira@gmail.com",
      "knowsAbout": [
        "Django",
        "Python",
        "Data Analysis",
        "HTMX",
        "Tailwind CSS",
        "Civil Engineering"
      ]
    }
    </script>
    <script>
    // Language redirect
    (() => {
      if (localStorage.getItem("lang")) return; // only redict on first visit

      const wantsPt = navigator.language.toLowerCase().startsWith("pt");
      const onPt = location.pathname.startsWith("/pt/");

      if (wantsPt && !onPt) {
        localStorage.setItem("lang", "pt");
        location.replace("/pt" + location.pathname);
      } else {
        localStorage.setItem("lang", "en");
      }
    })();

    // Theme initialization
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (prefersDark ? "night" : "corporate");
      document.documentElement.setAttribute("data-theme", theme);
    })();
    </script>
    <link rel="stylesheet" href="{{ get_url(path='css/output.css') }}">
    <script src="{{ get_url(path='js/theme.js') }}"></script>
    <script src="{{ get_url(path='js/navbar.js') }}"></script>
    <script src="{{ get_url(path='js/modal.js') }}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body class="font-sans min-h-screen leading-relaxed">
    <div class="absolute flex align-center justify-end gap-1 z-20 right-0 p-0.5 sm:p-2 md:p-3">
      <button type="button"
              class="cursor-pointer"
              popovertarget="popover-1"
              style="anchor-name:--anchor-1">
        <svg class="h-7 w-7 stroke-base-100 md:stroke-current"
             xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             viewBox="0 0 24 24"
             fill="none"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
          <path d="m5 8 6 6" />
          <path d="m4 14 6-6 2-3" />
          <path d="M2 5h12" />
          <path d="M7 2h1" />
          <path d="m22 22-5-10-5 10" />
          <path d="M14 18h6" />
        </svg>
      </button>
      {% set path = current_path | default(value="/") %}
      <ul class="dropdown dropdown-center menu w-52 rounded-box bg-base-100 shadow-sm"
          popover
          id="popover-1"
          style="position-anchor:--anchor-1">
        <li>
          <a href="{{ path | replace(from="/pt", to="") }}"
             onclick="localStorage.setItem('lang', 'en')">
            <img src="/img/uk.svg" alt="UK flag" width="24" height="24">
            English
          </a>
        </li>
        <li>
          <a href="/pt{{ path | replace(from="/pt", to="") }}"
             onclick="localStorage.setItem('lang', 'pt')">
            <img src="/img/br.svg" alt="Brazil flag" width="24" height="24">
            Português
          </a>
        </li>
      </ul>
      <div x-data="themeToggle()">
        <label class="swap swap-rotate">
          <input type="checkbox"
                 class="theme-controller"
                 value="night"
                 :checked="isDark"
                 @change="toggle()" />
          {# Sun icon #}
          <svg class="swap-off h-8 w-8 fill-base-100 md:fill-current"
               xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 24 24">
            <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
          </svg>
          {# Moon icon #}
          <svg class="swap-on h-8 w-8 fill-base-100 md:fill-current"
               xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 24 24">
            <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
          </svg>
        </label>
      </div>
    </div>
    <div id="content">
      {% block content %}
      {% endblock content %}
    </div>
  </body>
</html>
