version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      dev-tools:
        dependency-type: development
        exclude-patterns: ["tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly