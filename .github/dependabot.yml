version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      dev-tools:
        dependency-type: development
        exclude-patterns: ["tailwindcss", "@tailwindcss/*"]
    open-pull-requests-limit: 3

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-tools:
        patterns: ["*"]
    open-pull-requests-limit: 3